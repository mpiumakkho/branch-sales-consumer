name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Unit tests and Testcontainers tests (Kafka + PostgreSQL in Docker on the runner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify

  infra:
    # The HQ stack from infra/ with the real listener security, checked by the smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          sed "s/^HQ_DB_PASSWORD=.*/HQ_DB_PASSWORD=ci-$GITHUB_RUN_ID/" .env.example > .env
          tls/generate-certs.sh
      - name: Start Kafka, edge and HQ DB
        run: |
          docker compose up -d
          # kafka-init creates the dead-letter topic once Kafka is healthy, then exits
          for _ in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' hq-kafka-init 2>/dev/null || true)
            [[ "$state" == "exited 0" ]] && break
            [[ "$state" == exited* ]] && { docker compose logs kafka kafka-init; exit 1; }
            sleep 5
          done
          [[ "$state" == "exited 0" ]] || { docker compose logs; exit 1; }
      - run: ./smoke-test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
