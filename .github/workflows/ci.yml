name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Unit tests and Testcontainers tests (PostgreSQL + one Kafka per test branch, in Docker on the runner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify

  infra:
    # The HQ stack from infra/ (database, networks) with the smoke test and the onboarding scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          sed "s/^HQ_DB_PASSWORD=.*/HQ_DB_PASSWORD=ci-$GITHUB_RUN_ID/" .env.example > .env
          tls/generate-certs.sh
      - name: Start the HQ database
        run: |
          docker compose up -d
          for _ in $(seq 1 30); do
            [[ "$(docker inspect -f '{{.State.Health.Status}}' hq-db 2>/dev/null)" == "healthy" ]] && break
            sleep 5
          done
          docker inspect -f '{{.State.Health.Status}}' hq-db | grep -qx healthy || { docker compose logs; exit 1; }
          # The consumer's migrations create the tables; run them once without starting the consumer
          docker compose --profile consumer run --rm --no-deps -e SPRING_MAIN_WEB_APPLICATION_TYPE=none \
            --entrypoint sh consumer -c 'true' || true
      - run: ./smoke-test.sh
      - name: Onboard and offboard a branch
        run: |
          # The registry table comes from the consumer's migration V4; create the minimum here, as the consumer would
          docker exec -i hq-db psql -U hq_app -d hq_sales -v ON_ERROR_STOP=1 <<'SQL'
          create table if not exists branch (branch_code varchar(10) primary key, name varchar(200) not null,
            created_at timestamptz not null default now(), kafka_bootstrap varchar(255));
          SQL
          HQ_KAFKA_PASSWORD=ci-pass-$GITHUB_RUN_ID ./onboard-branch.sh BR0001 "CI branch"
          test -f tls/out/branches/BR0001/kafka.pem
          test "$(cat secrets/branch-kafka/BR0001)" = "ci-pass-$GITHUB_RUN_ID"
          openssl x509 -in tls/out/branches/BR0001/kafka.crt -noout -ext subjectAltName | grep -q kafka.br0001.example
          docker exec hq-db psql -U hq_app -d hq_sales -tAc "select kafka_bootstrap from branch where branch_code = 'BR0001'" \
            | grep -qx kafka.br0001.example:9094
          ./offboard-branch.sh BR0001
          test ! -f secrets/branch-kafka/BR0001
          docker exec hq-db psql -U hq_app -d hq_sales -tAc "select coalesce(kafka_bootstrap, 'null') from branch where branch_code = 'BR0001'" \
            | grep -qx null
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
