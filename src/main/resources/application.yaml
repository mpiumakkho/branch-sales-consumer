spring:
  application:
    name: branch-sales-consumer

  datasource:
    # Defaults match infra/docker-compose.yml when the consumer runs on the host
    url: ${HQ_DB_URL:jdbc:postgresql://localhost:5433/hq_sales}
    username: ${HQ_DB_USER:hq_app}
    password: ${HQ_DB_PASSWORD}

  # Shared client settings for every branch cluster. The address and credentials of each branch are added per branch
  # (branch registry + branch-sales.branch-kafka below), so spring.kafka.bootstrap-servers is not used.
  kafka:
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Raw bytes: the listener parses JSON itself so a bad value becomes INVALID_JSON instead of a deserializer error,
      # and dead_letter keeps the original bytes
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      # Upper bound on records handled per poll and branch; this controls load on the HQ DB
      max-poll-records: ${CONSUMER_MAX_POLL_RECORDS:100}
    producer:
      # Receipts to the branches
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        # A receipt to an unreachable branch fails within ~30 s and is retried by the listener's error handler
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 10000

# Health and metrics only (README, Monitoring): GET /actuator/health and /actuator/prometheus. No authentication:
# the consumer is also on the wan network, so in Docker it listens on its HQ-network address only
server:
  port: ${CONSUMER_HTTP_PORT:8081}
  address: ${CONSUMER_HTTP_ADDRESS:0.0.0.0}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

branch-sales:
  branch-kafka:
    # All record topics exist in every upgraded branch cluster (contract/README.md); older clusters are read partially
    summary-topic: branch-sales.daily-summary
    return-topic: branch-sales.daily-return
    shift-close-topic: branch-sales.shift-close
    receipt-topic: branch-sales.receipt
    group-id: hq-branch-sales-consumer
    security-protocol: ${BRANCH_KAFKA_SECURITY_PROTOCOL:SASL_SSL}
    # SCRAM user created at every branch broker for HQ (branch kafka-init); one password per branch
    username: hq
    password-dir: ${BRANCH_KAFKA_PASSWORD_DIR:/run/secrets/branch-kafka}
    # HQ CA (infra/tls/generate-certs.sh), which signs every branch broker certificate
    truststore: ${BRANCH_KAFKA_TRUSTSTORE:/certs/ca.crt}
    send-timeout: 40s
    # Branches whose registry row has this shard are read by this instance (infra/onboard-branch.sh, BRANCH_SHARD)
    shard: ${CONSUMER_SHARD:default}
    # How soon a branch onboarded or offboarded in the registry is connected or disconnected
    registry-refresh-ms: ${BRANCH_REGISTRY_REFRESH_MS:60000}
  dead-letter:
    # How often rows with replay_requested_at are looked for
    replay-interval-ms: ${DEAD_LETTER_REPLAY_INTERVAL_MS:30000}
