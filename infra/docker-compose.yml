# HQ side: HQ PostgreSQL and the HQ consumer. Kafka runs at every branch (requirements §16); HQ connects to each
# branch's broker through the `wan` network and has no inbound port.
#
# Networks
#   hq   - HQ internal: consumer, HQ DB
#   wan  - simulates the internet. HQ's only container on it is the consumer, which connects out to every branch's
#          edge (kafka.<branch>.example:9094). Branches join `wan` with their edge container only (producer repo).

name: branch-sales-hq

services:
  hq-db:
    image: postgres:18.6-alpine
    container_name: hq-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hq_sales
      POSTGRES_USER: hq_app
      POSTGRES_PASSWORD: ${HQ_DB_PASSWORD:?set HQ_DB_PASSWORD in infra/.env}
    ports:
      # This machine only
      - "127.0.0.1:${HQ_DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker
      - hq-db-data:/var/lib/postgresql
    networks:
      - hq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hq_app -d hq_sales"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # The HQ consumer, built from this repo. Profile `consumer`, so `docker compose up -d` alone starts only the DB
  # (for running the consumer from an IDE instead).
  consumer:
    build: ..
    image: branch-sales-consumer:local
    container_name: hq-consumer
    profiles: ["consumer"]
    restart: unless-stopped
    depends_on:
      hq-db:
        condition: service_healthy
    environment:
      HQ_DB_URL: jdbc:postgresql://hq-db:5432/hq_sales
      HQ_DB_PASSWORD: ${HQ_DB_PASSWORD:?set HQ_DB_PASSWORD in infra/.env}
      # Every branch broker: TLS (certificate signed by the HQ CA, host name checked) + SCRAM user "hq"
      BRANCH_KAFKA_SECURITY_PROTOCOL: SASL_SSL
      BRANCH_KAFKA_TRUSTSTORE: /certs/ca.crt
      BRANCH_KAFKA_PASSWORD_DIR: /run/secrets/branch-kafka
      # Branches this instance reads (registry column shard). One instance with every branch in "default" here.
      CONSUMER_SHARD: ${CONSUMER_SHARD:-default}
    ports:
      # Health and metrics (/actuator/health, /actuator/prometheus), this machine only; no authentication
      - "127.0.0.1:${CONSUMER_HTTP_PORT:-8081}:8081"
    volumes:
      # HQ CA certificate (tls/generate-certs.sh). Only the certificate: the CA key stays on the host.
      - ./tls/out/ca.crt:/certs/ca.crt:ro
      # HQ's password at each branch, one file per branch code (onboard-branch.sh)
      - ./secrets/branch-kafka:/run/secrets/branch-kafka:ro
    networks:
      - hq
      - wan

volumes:
  hq-db-data:

networks:
  hq:
    name: branch-sales-hq
  wan:
    name: branch-sales-wan
