# hq-edge: stands in for the HQ firewall / port forward. It is the only HQ container on the wan network and forwards
# one TCP port, 9094, to Kafka's EXTERNAL listener. TLS is not terminated here: it runs end to end between the branch
# and the broker, so the edge never sees passwords or data.
global
    log stdout format raw local0

resolvers docker
    nameserver dns 127.0.0.11:53

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    # Kafka clients keep connections open between sends
    timeout client 1h
    timeout server 1h

frontend kafka_external
    bind :9094
    default_backend kafka

backend kafka
    # Resolved through Docker DNS at runtime, so a recreated Kafka container with a new IP is found again
    server kafka kafka:9094 resolvers docker init-addr none check
